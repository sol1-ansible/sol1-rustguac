---
# Install rustguac from the Sol1 apt repository (packages.sol1.net). The repo itself is
# configured by the shared sol1-packages_repo role.
- name: Ensure the Sol1 packages repository is configured
  ansible.builtin.include_role:
    name: sol1-packages_repo
  vars:
    sol1_packages_repo_debian_release_codename: "{{ ansible_distribution_release }}"

- name: Install rustguac (latest) from the Sol1 packages repository
  ansible.builtin.apt:
    name: rustguac
    state: latest
    update_cache: true
  when: rustguac_version == 'latest'
  notify: restart rustguac

- name: Install rustguac (pinned) from the Sol1 packages repository
  ansible.builtin.apt:
    name: "rustguac={{ rustguac_version }}"
    state: present
    update_cache: true
  when: rustguac_version != 'latest'
  notify: restart rustguac
