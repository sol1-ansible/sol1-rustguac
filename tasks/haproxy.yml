---
# Front rustguac with HAProxy via the shared sol1.haproxy role. rustguac contributes a
# single TLS-terminating frontend + backend; sol1.haproxy owns /etc/haproxy/haproxy.cfg.
# The combined PEM at rustguac_haproxy_cert is expected to already exist on the host.
- name: Configure HAProxy via sol1.haproxy
  ansible.builtin.include_role:
    name: sol1.haproxy
  vars:
    haproxy_global_ssl_default_bind_options: "no-sslv3 no-tlsv10 no-tlsv11"
    haproxy_frontend:
      - name: https
        mode: http
        bind:
          - listen: "*:443"
            param:
              - ssl
              - "crt {{ rustguac_haproxy_cert }}"
              - "alpn h2,http/1.1"
          - listen: "*:80"
        redirect:
          - string: "scheme https"
            cond: "unless { ssl_fc }"
        http_request:
          - action: "del-header X-Forwarded-For"
        option:
          - forwardfor
        http_response:
          - action: 'set-header Strict-Transport-Security "max-age=31536000; includeSubDomains"'
        default_backend: rustguac
    haproxy_backend:
      - name: rustguac
        mode: http
        option:
          - httpchk
        timeout:
          - type: tunnel
            timeout: 8h
        server:
          - name: rustguac
            listen: "{{ rustguac_listen_addr }}"
            param:
              - ssl
              - "verify none"
              - check
              - "inter 30s"
        # HAProxy 3.x form of the health check (inline `option httpchk GET` is deprecated)
        raw_options:
          - "http-check send meth GET uri /api/health"
          - "http-check expect status 200"
